# CI for the infrastructure repo: cheap static checks that need no AWS access.
#
# Every `uses:` is pinned to a full commit SHA (a tag can be moved by its owner; a SHA cannot).
# The comment after the SHA says which release it is. Renovate/Dependabot updates both.
#
# `terraform plan` on pull requests needs an AWS role (read-only) and is added later together
# with a plan-only OIDC role (a Phase 0 follow-up: an "infra-plan" role).
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for the automatic GITHUB_TOKEN: these jobs only read the repository.
permissions:
  contents: read

# A newer push to the same PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: terraform-fmt-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Validate every layer
        run: |
          for dir in $(find . -mindepth 2 -maxdepth 2 -name versions.tf -exec dirname {} \;); do
            echo "== $dir"
            (cd "$dir" && terraform init -backend=false -input=false && terraform validate)
          done

  secrets:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not only the last commit
      # We run the gitleaks program itself, pinned by version AND checksum, instead of the
      # gitleaks-action wrapper: the wrapper crashed on a push whose first commit is the root commit
      # (it runs `git log <root>^..`, and the root has no parent), and it adds licence rules.
      - name: Install gitleaks (pinned, checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the whole git history
        run: ./gitleaks git --no-banner --redact --verbose .
