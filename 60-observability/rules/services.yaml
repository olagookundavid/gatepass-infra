# Prometheus alert rules about the SERVICES, from the RED metrics every Go service emits through
# OpenTelemetry (rate, errors, duration) and the Kubernetes state of their namespaces.
#
# SLO targets (PLAN section 8): availability 99.5% (non-5xx) and p95 latency < 300 ms per public
# endpoint. The rules below page well before the monthly error budget is gone:
#   ServiceHighErrorRate   more than 5% of requests are 5xx for 5 minutes (fast burn)
#   ServiceElevatedErrors  more than 0.5% are 5xx for 1 hour (slow burn: the budget is leaking)
#   ServiceHighLatencyP95  p95 above 300 ms for 10 minutes
# VERIFIED 2026-11-07 on the first cluster run: the OTLP-to-Prometheus names are
# http_server_request_duration_seconds_{bucket,count,sum} with labels http_response_status_code,
# http_route and service_name (the binary's name, for example skeleton-api).
# HEALTH PROBES ARE EXCLUDED (http_route!~".*/(livez|readyz)"): the kubelet calls them every few
# seconds and the metrics record them like any request, so a service that is deliberately not ready
# (a bad release, FORCE_NOT_READY) answered 503 to its own probes and raised ServiceHighErrorRate,
# a "users are failing" page, when no user request had failed (seen 2026-11-07). Requests that match
# no route have no http_route label and stay counted.
groups:
  - name: services
    rules:
      - alert: ServiceHighErrorRate
        expr: |
          sum by (service_name) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5..",http_route!~".*/(livez|readyz)"}[5m]))
            /
          sum by (service_name) (rate(http_server_request_duration_seconds_count{http_route!~".*/(livez|readyz)"}[5m])) > 0.05
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.service_name }}: more than 5% of requests fail"
          description: "5xx ratio over 5 minutes is {{ $value | humanizePercentage }} (SLO: 99.5% non-5xx)."
          runbook: "Open the Service RED dashboard, then the logs: level=error for this service; if it follows a deploy, revert the gitops pull request"

      - alert: ServiceElevatedErrors
        expr: |
          sum by (service_name) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5..",http_route!~".*/(livez|readyz)"}[1h]))
            /
          sum by (service_name) (rate(http_server_request_duration_seconds_count{http_route!~".*/(livez|readyz)"}[1h])) > 0.005
        for: 1h
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.service_name }}: the error budget is leaking"
          description: "More than 0.5% of requests failed over the last hour."
          runbook: "Open the Service RED dashboard; find the endpoint with the most 5xx"

      - alert: ServiceHighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le, service_name) (rate(http_server_request_duration_seconds_bucket{http_route!~".*/(livez|readyz)"}[5m]))) > 0.3
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.service_name }}: p95 latency above 300 ms"
          description: "p95 over 5 minutes is {{ $value | humanizeDuration }}."
          runbook: "Open the Service RED dashboard and a slow trace in X-Ray; check the database and cache spans"

      - alert: DeploymentReplicasUnavailable
        expr: kube_deployment_status_replicas_unavailable{namespace=~"gatepass-.*"} > 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas"
          description: "Pods are not Ready: a bad image, a failing readiness probe or no capacity."
          runbook: "kubectl -n {{ $labels.namespace }} describe deploy {{ $labels.deployment }}; kubectl -n {{ $labels.namespace }} get events"

      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total{namespace=~"gatepass-.*"}[15m]) > 3
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} restarted more than 3 times in 15 minutes"
          description: "Container {{ $labels.container }} keeps crashing."
          runbook: "kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} --previous"

      # --- Phase 9 (walkthrough 12): failure modes of the new moving parts. UNVERIFIED until the first run:
      # the exact metric names (outbox_unpublished arrives through OTLP, kube_horizontalpodautoscaler_* from
      # kube-state-metrics); walkthrough 12 step "alerts" lists the queries that prove them.
      - alert: OutboxBacklog
        # The orders events are written in the database transaction of an order and published by the
        # relay. A gauge above zero for minutes means the relay is down or EventBridge refuses events:
        # paid orders without mail, cancelled orders without tickets coming back.
        expr: max(outbox_unpublished) > 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Order events are waiting in the outbox ({{ $value }} unpublished)"
          description: "orders-outbox-relay is not publishing: events of paid or cancelled orders are not leaving the database."
          runbook: "kubectl -n gatepass-orders get pods -l app.kubernetes.io/name=orders-outbox-relay; kubectl -n gatepass-orders logs deploy/orders-outbox-relay"

      - alert: AutoscalerAtMaximum
        # The HPA wants more pods than its ceiling allows. Not an outage yet, but the service has no
        # headroom left: raise maxReplicas (mind the database connections) or find the cause of the load.
        expr: kube_horizontalpodautoscaler_status_current_replicas{namespace=~"gatepass-.*"} == kube_horizontalpodautoscaler_spec_max_replicas{namespace=~"gatepass-.*"}
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }} has been at its maximum replicas for 15 minutes"
          description: "The autoscaler cannot add pods: capacity is capped by maxReplicas."
          runbook: "kubectl -n {{ $labels.namespace }} describe hpa {{ $labels.horizontalpodautoscaler }}; check the load in Grafana"
